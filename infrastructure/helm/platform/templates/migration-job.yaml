{{- if .Values.migrations.enabled }}
{{- $migrationImage := printf "%s:%s" .Values.migrations.image.repository .Values.migrations.image.tag }}
{{- if .Values.migrations.image.digest }}
{{- $migrationImage = printf "%s@%s" .Values.migrations.image.repository .Values.migrations.image.digest }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: {{ $migrationImage | quote }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.migrations.secretName }}
          env:
            - name: USER_DB
              value: {{ .Values.migrations.userDb | quote }}
            - name: PROJECT_DB
              value: {{ .Values.migrations.projectDb | quote }}
            - name: NOTIFICATION_DB
              value: {{ .Values.migrations.notificationDb | quote }}
            - name: AUDIT_DB
              value: {{ .Values.migrations.auditDb | quote }}
            - name: SYNC_DB
              value: {{ if .Values.migrations.syncDb.enabled }}{{ .Values.migrations.syncDb.name | quote }}{{ else }}""{{ end }}
{{- end }}
