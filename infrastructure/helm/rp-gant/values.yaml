global:
  imageTag: main
imagePolicy:
  requireDigests: false

api-gateway:
  replicaCount: 2
user-service:
  replicaCount: 2
project-service:
  replicaCount: 2
notification-service:
  replicaCount: 1
  fullnameOverride: notification-service
audit-service:
  replicaCount: 1
sync-service:
  replicaCount: 1
frontend:
  replicaCount: 2
platform:
  migrations:
    enabled: true
  backup:
    enabled: false
