sync-service:
  ingress:
    enabled: true
    className: yandex-alb
    hosts:
      - host: api.staging.rp-gant.example.com
        paths:
          - path: /ws
            pathType: Prefix
  syncDatabase:
    enabled: true
    secretName: rp-gant-sync
    secretKey: DATABASE_URL_SYNC
  kafkaSecurity:
    enabled: true
    bootstrapServers: ""
    topic: rp_gant.events
    saslMechanism: scram-sha-512
    secretName: rp-gant-sync
    usernameKey: username
    passwordKey: password
    caKey: KAFKA_SSL_CA
  externalSecret:
    enabled: true
    targetSecretName: rp-gant-sync
    data:
      - secretKey: token
        remoteRef:
          key: rp-gant/staging/sync-service
          property: token
      - secretKey: DATABASE_URL_SYNC
        remoteRef:
          key: rp-gant/staging/sync-service
          property: database_url
      - secretKey: username
        remoteRef:
          key: rp-gant/staging/sync-service
