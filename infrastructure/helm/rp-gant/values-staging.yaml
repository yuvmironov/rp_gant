imagePolicy:
  requireDigests: true
frontend:
  ingress:
    hosts:
      - host: app.staging.rp-gant.example.com
        paths:
          - path: /
            pathType: Prefix
api-gateway:
  ingress:
    hosts:
      - host: api.staging.rp-gant.example.com
        paths:
          - path: /
            pathType: Prefix
platform:
  migrations:
    syncDb:
      enabled: true
      name: rp_gant_sync
  backup:
    enabled: true
    schedule: "0 2 * * *"

# Secret references only. Image tags/digests are managed separately by the release process.
user-service:
  kafkaSecurity:
    enabled: true
    bootstrapServers: ""
    topic: rp_gant.events
    saslMechanism: scram-sha-512
    secretName: user-service
    usernameKey: username
    passwordKey: password
    caKey: KAFKA_SSL_CA
  externalSecret:
    enabled: true
    targetSecretName: user-service
    data:
      - secretKey: DATABASE_URL
        remoteRef:
          key: rp-gant/staging/user-service
          property: database_url
      - secretKey: username
        remoteRef:
          key: rp-gant/staging/user-service
          property: kafka_sasl_username
      - secretKey: password
        remoteRef:
          key: rp-gant/staging/user-service
          property: kafka_sasl_password
      - secretKey: KAFKA_SSL_CA
        remoteRef:
          key: rp-gant/staging/user-service
          property: kafka_ca_pem
          optional: true

