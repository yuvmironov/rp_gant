nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/yuvmironov/rp-gant/sync-service
  tag: main
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 2

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
podLabels: {}

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

grpc:
  enabled: false
  port: 50051

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5

env:
  - name: PORT
    value: "8080"
  - name: NODE_ENV
    value: "production"
  - name: LOG_LEVEL
    value: "info"
  - name: KAFKA_CONSUMER_GROUP_SYNC
    value: "sync"
  - name: SYNC_SERVICE_URL
    value: "http://127.0.0.1:8080"
  - name: SYNC_TOKEN_SECRET
    valueFrom:
      secretKeyRef:
        name: rp-gant-sync
        key: token

envFrom: []
syncDatabase:
  enabled: false
  secretName: rp-gant-sync
  secretKey: DATABASE_URL_SYNC
kafkaSecurity:
  enabled: false
  bootstrapServers: "kafka:9092"
  topic: rpgant.events
  saslMechanism: scram-sha-512
  secretName: rp-gant-sync
  usernameKey: username
  passwordKey: password
  caKey: ""
externalSecret:
  enabled: false
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  refreshInterval: 1h
  targetSecretName: rp-gant-sync
  data: []


autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: yandex-alb
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: false
  ingress: []
  egress: []
