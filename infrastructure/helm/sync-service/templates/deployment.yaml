{{- if and .Values.kafkaSecurity.enabled (or (not .Values.kafkaSecurity.bootstrapServers) (not .Values.kafkaSecurity.topic)) }}
{{- fail "kafkaSecurity.enabled requires bootstrapServers and topic" }}
{{- end }}
{{- if and .Values.kafkaSecurity.enabled (not (has .Values.kafkaSecurity.saslMechanism (list "plain" "scram-sha-256" "scram-sha-512"))) }}
{{- fail "kafkaSecurity.saslMechanism must be a supported KafkaJS mechanism" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rp-gant-service.fullname" . }}
  labels:
    {{- include "rp-gant-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "rp-gant-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "rp-gant-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rp-gant-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "rp-gant-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.port }}
              protocol: TCP
            {{- end }}
          {{- if or .Values.env .Values.syncDatabase.enabled .Values.kafkaSecurity.enabled }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.syncDatabase.enabled }}
            - name: DATABASE_URL_SYNC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.syncDatabase.secretName | quote }}
                  key: {{ .Values.syncDatabase.secretKey | quote }}
            {{- end }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafkaSecurity.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafkaSecurity.topic | quote }}
            {{- if .Values.kafkaSecurity.enabled }}
            - name: KAFKA_SSL
              value: "true"
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.kafkaSecurity.saslMechanism | quote }}
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaSecurity.secretName | quote }}
                  key: {{ .Values.kafkaSecurity.usernameKey | quote }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaSecurity.secretName | quote }}
                  key: {{ .Values.kafkaSecurity.passwordKey | quote }}
            {{- with .Values.kafkaSecurity.caKey }}
            - name: KAFKA_SSL_CA
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.kafkaSecurity.secretName | quote }}
                  key: {{ . | quote }}
                  optional: true
            {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
