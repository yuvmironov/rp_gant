name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Contract checks
        run: pnpm test:contract

      - name: Build
        run: pnpm build

  db-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rp_gant
          POSTGRES_PASSWORD: rp_gant_dev
          POSTGRES_DB: rp_gant_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rp_gant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Check bootstrap
        run: sh tools/check-db-bootstrap.sh

  vps-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate VPS Compose configuration
        run: |
          set -euo pipefail
          docker compose --env-file infrastructure/vps/.env.example -f infrastructure/vps/docker-compose.yml config --quiet
          docker compose --env-file infrastructure/vps/.env.example -f infrastructure/vps/docker-compose.yml config > /tmp/rp-gant-vps-compose.yaml
          grep -q 'DATABASE_URL_SYNC:' /tmp/rp-gant-vps-compose.yaml
          grep -q 'SYNC_DB: rp_gant_sync' /tmp/rp-gant-vps-compose.yaml
          grep -q 'PGHOST: postgres' /tmp/rp-gant-vps-compose.yaml
          grep -q 'PGDATABASE: rp_gant_sync' /tmp/rp-gant-vps-compose.yaml
          for topic in dlq.notification dlq.audit dlq.sync replay.audit replay.notification replay.sync; do
            grep -Fq "rp_gant.events.$topic" /tmp/rp-gant-vps-compose.yaml
          done

  helm-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Build umbrella dependencies
        run: helm dependency build infrastructure/helm/rp-gant

      - name: Lint service and platform charts
        run: |
          set -euo pipefail
          for chart in user-service project-service notification-service audit-service; do
            helm lint "infrastructure/helm/$chart" --set global.imageTag=main
          done
          helm lint infrastructure/helm/sync-service --set global.imageTag=main
          helm lint infrastructure/helm/platform

      - name: Verify production remains opt-out for Sync DB
        run: |
          set -euo pipefail
          helm template rp-gant infrastructure/helm/rp-gant -f infrastructure/helm/rp-gant/values.yaml -f infrastructure/helm/rp-gant/values-prod.yaml > /tmp/rp-gant-production.yaml
          if grep -q 'name: DATABASE_URL_SYNC' /tmp/rp-gant-production.yaml; then
            echo "production unexpectedly enables Sync DB secret"
            exit 1
          fi
          if grep -q 'KAFKA_SASL_MECHANISM' /tmp/rp-gant-production.yaml; then
            echo "production unexpectedly enables staging Kafka security values"
            exit 1
          fi
          grep -A1 'name: SYNC_DB' /tmp/rp-gant-production.yaml | grep -q 'value: ""'

      - name: Lint and render staging values with pinned image digests
        run: |
          set -euo pipefail
          digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          args=(
            -f infrastructure/helm/rp-gant/values.yaml
            -f infrastructure/helm/rp-gant/values-staging.yaml
            --set api-gateway.image.digest="$digest"
            --set user-service.image.digest="$digest"
            --set project-service.image.digest="$digest"
            --set notification-service.image.digest="$digest"
            --set audit-service.image.digest="$digest"
            --set sync-service.image.digest="$digest"
            --set frontend.image.digest="$digest"
            --set platform.migrations.image.digest="$digest"
            --set user-service.kafkaSecurity.bootstrapServers=broker.staging.example.com:9092
            --set project-service.kafkaSecurity.bootstrapServers=broker.staging.example.com:9092
            --set notification-service.kafkaSecurity.bootstrapServers=broker.staging.example.com:9092
            --set audit-service.kafkaSecurity.bootstrapServers=broker.staging.example.com:9092
            --set sync-service.kafkaSecurity.bootstrapServers=broker.staging.example.com:9092
          )
          if helm template rp-gant infrastructure/helm/rp-gant -f infrastructure/helm/rp-gant/values.yaml -f infrastructure/helm/rp-gant/values-staging.yaml >/dev/null 2>&1; then
            echo "staging render unexpectedly accepted missing image digests"
            exit 1
          fi
          if helm template rp-gant infrastructure/helm/rp-gant \
            -f infrastructure/helm/rp-gant/values.yaml \
            -f infrastructure/helm/rp-gant/values-staging.yaml \
            --set api-gateway.image.digest="$digest" \
            --set user-service.image.digest="$digest" \
            --set project-service.image.digest="$digest" \
            --set notification-service.image.digest="$digest" \
            --set audit-service.image.digest="$digest" \
            --set sync-service.image.digest="$digest" \
            --set frontend.image.digest="$digest" \
            --set platform.migrations.image.digest="$digest" >/dev/null 2>&1; then
            echo "staging render unexpectedly accepted missing Kafka bootstrap endpoints"
            exit 1
          fi
          helm lint infrastructure/helm/rp-gant "${args[@]}"
          helm template rp-gant infrastructure/helm/rp-gant "${args[@]}" > /tmp/rp-gant-staging.yaml
          grep -q 'name: DATABASE_URL_SYNC' /tmp/rp-gant-staging.yaml
          grep -q 'value: "rp_gant_sync"' /tmp/rp-gant-staging.yaml
          grep -q 'KAFKA_SASL_MECHANISM' /tmp/rp-gant-staging.yaml
          grep -q 'value: "broker.staging.example.com:9092"' /tmp/rp-gant-staging.yaml
          grep -q 'value: "rp_gant.events"' /tmp/rp-gant-staging.yaml
          grep -q 'rp-gant/staging/sync-service' /tmp/rp-gant-staging.yaml
          grep -q 'path: /ws' /tmp/rp-gant-staging.yaml

  ci-required:
    if: always()
    needs: [quality, db-bootstrap, vps-compose, helm-templates]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "quality failed"
            exit 1
          fi
          if [ "${{ needs.db-bootstrap.result }}" != "success" ]; then
            echo "db-bootstrap failed"
            exit 1
          fi
          if [ "${{ needs.vps-compose.result }}" != "success" ]; then
            echo "vps-compose failed"
            exit 1
          fi
          if [ "${{ needs.helm-templates.result }}" != "success" ]; then
            echo "helm-templates failed"
            exit 1
          fi
          echo "ci ok"
